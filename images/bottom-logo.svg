<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 830 192" width="100%" height="400" style="display: block;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="dbTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b4d5fe" />
      <stop offset="100%" stop-color="#7eaef5" />
    </linearGradient>
    <linearGradient id="dbDiskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f86d9" />
      <stop offset="50%" stop-color="#72a5f0" />
      <stop offset="100%" stop-color="#4174c4" />
    </linearGradient>
    <linearGradient id="monitorScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#edf2f9" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242833" />
      <stop offset="50%" stop-color="#343a48" />
      <stop offset="100%" stop-color="#222630" />
    </linearGradient>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="120" cy="198" rx="46" ry="5" fill="#000000" opacity="0.12" />
  <ellipse cx="450" cy="201" rx="66" ry="5" fill="#000000" opacity="0.12" />
  <ellipse cx="780" cy="198" rx="58" ry="5" fill="#000000" opacity="0.12" />

  <!-- Connecting Bus Cables -->
  <line x1="210" y1="110" x2="385" y2="110" stroke="#3568ad" stroke-width="8" stroke-linecap="round" />
  <line x1="515" y1="110" x2="720" y2="110" stroke="#3568ad" stroke-width="8" stroke-linecap="round" />

  <!-- ==================== CLIENT (MONITOR) ==================== -->
  <!-- Stand & Base -->
  <path d="M 100 162 L 92 188 L 148 188 L 140 162 Z" fill="#1b2434" stroke="#121824" stroke-width="4" stroke-linejoin="round" />
  <rect x="74" y="188" width="92" height="10" rx="5" fill="#243046" stroke="#121824" stroke-width="4" />

  <!-- Monitor Body -->
  <rect x="24" y="32" width="192" height="132" rx="10" fill="#243048" stroke="#121824" stroke-width="4.5" />
  <!-- Display Bezel Interior -->
  <rect x="34" y="42" width="172" height="112" rx="4" fill="url(#monitorScreenGrad)" />

  <!-- Browser Header -->
  <rect x="34" y="42" width="172" height="20" rx="3" fill="#3a6cb4" />
  <!-- Header Window Dots -->
  <circle cx="45" cy="52" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="53" cy="52" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="61" cy="52" r="2.5" fill="#ffffff" opacity="0.9" />

  <!-- Browser Content -->
  <rect x="46" y="74" width="58" height="52" rx="4" fill="#4d7ec9" />
  <rect x="114" y="76" width="80" height="5.5" rx="2.5" fill="#cad5e2" />
  <rect x="114" y="87" width="68" height="5.5" rx="2.5" fill="#cad5e2" />
  <rect x="114" y="98" width="76" height="5.5" rx="2.5" fill="#cad5e2" />
  <rect x="114" y="109" width="54" height="5.5" rx="2.5" fill="#cad5e2" />
  <rect x="156" y="118" width="38" height="18" rx="3" fill="#9fb1c7" />

  <!-- ==================== SERVER ==================== -->
  <!-- Outer Chassis -->
  <rect x="385" y="20" width="130" height="180" rx="16" fill="url(#serverGrad)" stroke="#12161f" stroke-width="4.5" />
  <rect x="375" y="196" width="150" height="8" rx="4" fill="#141822" stroke="#12161f" stroke-width="2" />

  <!-- Inner Bay Area -->
  <rect x="398" y="32" width="104" height="154" rx="8" fill="#1b1e26" />

  <!-- Drive Bay 1 -->
  <rect x="408" y="42" width="84" height="22" rx="4" fill="#282d38" stroke="#10131a" stroke-width="2" />
  <circle cx="478" cy="53" r="3.5" fill="#58a6ff" />
  <line x1="416" y1="53" x2="464" y2="53" stroke="#1d212a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Drive Bay 2 -->
  <rect x="408" y="68" width="84" height="22" rx="4" fill="#282d38" stroke="#10131a" stroke-width="2" />
  <circle cx="478" cy="79" r="3.5" fill="#3fb950" />
  <line x1="416" y1="79" x2="464" y2="79" stroke="#1d212a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Drive Bay 3 -->
  <rect x="408" y="94" width="84" height="22" rx="4" fill="#282d38" stroke="#10131a" stroke-width="2" />
  <circle cx="478" cy="105" r="3.5" fill="#3fb950" />
  <line x1="416" y1="105" x2="464" y2="105" stroke="#1d212a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Drive Bay 4 -->
  <rect x="408" y="120" width="84" height="22" rx="4" fill="#282d38" stroke="#10131a" stroke-width="2" />
  <circle cx="478" cy="131" r="3.5" fill="#38bdf8" />
  <line x1="416" y1="131" x2="464" y2="131" stroke="#1d212a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Lower Ventilation Slits -->
  <line x1="420" y1="156" x2="480" y2="156" stroke="#10131a" stroke-width="3" stroke-linecap="round" />
  <line x1="420" y1="164" x2="480" y2="164" stroke="#10131a" stroke-width="3" stroke-linecap="round" />
  <line x1="420" y1="172" x2="480" y2="172" stroke="#10131a" stroke-width="3" stroke-linecap="round" />

  <!-- ==================== DATABASE ==================== -->
  <!-- Disk 3 (Bottom Layer) -->
  <path d="M 720 148 v 26 c 0 13.8 26.86 25 60 25 s 60 -11.2 60 -25 v -26 c 0 13.8 -26.86 25 -60 25 s -60 -11.2 -60 -25 Z" 
        fill="url(#dbDiskGrad)" stroke="#162238" stroke-width="4.5" stroke-linejoin="round" />
  <circle cx="742" cy="172" r="4" fill="#ffffff" opacity="0.9" />

  <!-- Disk 2 (Middle Layer) -->
  <path d="M 720 106 v 26 c 0 13.8 26.86 25 60 25 s 60 -11.2 60 -25 v -26 c 0 13.8 -26.86 25 -60 25 s -60 -11.2 -60 -25 Z" 
        fill="url(#dbDiskGrad)" stroke="#162238" stroke-width="4.5" stroke-linejoin="round" />
  <circle cx="742" cy="130" r="4" fill="#ffffff" opacity="0.9" />

  <!-- Disk 1 (Top Side) -->
  <path d="M 720 64 v 26 c 0 13.8 26.86 25 60 25 s 60 -11.2 60 -25 v -26 c 0 13.8 -26.86 25 -60 25 s -60 -11.2 -60 -25 Z" 
        fill="url(#dbDiskGrad)" stroke="#162238" stroke-width="4.5" stroke-linejoin="round" />
  <circle cx="742" cy="88" r="4" fill="#ffffff" opacity="0.9" />

  <!-- Disk 1 (Top Cap) -->
  <ellipse cx="780" cy="64" rx="60" ry="24" fill="url(#dbTopGrad)" stroke="#162238" stroke-width="4.5" />
</svg>
